# Nginx reverse proxy configuration for WellTrip Monolith (VPS)
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;

upstream django_upstream {
    server backend:8000;
}

# HTTP: Let's Encrypt challenges + redirect everything else to HTTPS
server {
    listen 80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name welltripthailand.com www.welltripthailand.com;

    ssl_certificate     /etc/letsencrypt/live/welltripthailand.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/welltripthailand.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static Assets
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Public Media Files
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Application Proxy
    location / {
        limit_req zone=req_limit_per_ip burst=20 nodelay;

        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 65s;
    }
}
