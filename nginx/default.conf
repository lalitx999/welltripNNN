# Nginx reverse proxy configuration for WellTrip Monolith (VPS)
# Not exposed on the host: Cloudflare Tunnel (cloudflared container) terminates
# HTTPS and forwards requests here over the internal docker network.

# Restore the real client IP sent by cloudflared (used by rate limiting and Django)
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=10r/s;

upstream django_upstream {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static Assets
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Payment slips are private: let Django check permissions
    location ^~ /media/slips/ {
        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Public Media Files
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Application Proxy
    location / {
        limit_req zone=req_limit_per_ip burst=20 nodelay;

        proxy_pass http://django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 65s;
    }
}
