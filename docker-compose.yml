services:
  redis:
    image: redis:7-alpine
    container_name: welltrip_redis
    restart: always
    networks:
      - db-network
    expose:
      - "6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: welltrip_backend
    restart: always
    ports:
      - "8016:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DATABASE_URL=postgres://postgres:661201123_Asd@shared-postgres:5432/welltrip_db
      - REDIS_URL=redis://welltrip_redis:6379/0
    volumes:
      - /mnt/hdd_backup/welltrip/media:/app/media
      - /mnt/hdd_backup/welltrip/static:/app/staticfiles
    depends_on:
      - redis
    networks:
      - db-network

networks:
  db-network:
    external: true
