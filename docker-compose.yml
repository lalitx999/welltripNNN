services:
  db:
    image: postgres:16-alpine
    container_name: welltrip_db
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-welltrip_db}
      - POSTGRES_USER=${POSTGRES_USER:-welltrip}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: welltrip_redis
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: welltrip_backend
    restart: always
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - DATABASE_URL=postgres://${POSTGRES_USER:-welltrip}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-welltrip_db}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: welltrip_nginx
    restart: always
    # 80/443 on this VPS belong to another project; Cloudflare forwards here
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - media:/app/media:ro
      - static:/app/staticfiles:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  media:
  static:
