{% extends "layouts/public.html" %}
{% load static %}

{% block content %}
<section class="container-xl py-4 py-lg-5">
  <div class="row g-4 g-lg-5 align-items-stretch">
    <div class="col-lg-6 d-none d-lg-block">
      <div class="wt-auth-photo h-100 d-flex flex-column justify-content-end p-5">
        <img src="{% block auth_image %}{% static 'images/c/rice.webp' %}{% endblock %}" alt="">
        <div>
          <span class="badge rounded-pill bg-white bg-opacity-25 px-3 py-2 mb-3"><i data-lucide="map-pin" class="me-1"></i>WellTrip Sisaket</span>
          <h2 class="display-6 fw-bold mb-2">{% block auth_headline %}{% endblock %}</h2>
          <p class="opacity-75 mb-0">โฮมสเตย์กลางธรรมชาติ อาหารสุขภาพ และสปาสมุนไพรจากชุมชนศรีสะเกษ</p>
        </div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="mx-auto" style="max-width: 30rem;">
        {% block auth_form %}{% endblock %}
      </div>
    </div>
  </div>
</section>
{% endblock %}
