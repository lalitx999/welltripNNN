{% if page_obj.has_other_pages %}
  <nav class="p-3 border-top" aria-label="แบ่งหน้า">
    <ul class="pagination pagination-sm mb-0 justify-content-end">
      {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?{{ query_prefix }}page={{ page_obj.previous_page_number }}">ก่อนหน้า</a></li>{% endif %}
      <li class="page-item disabled"><span class="page-link">หน้า {{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
      {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?{{ query_prefix }}page={{ page_obj.next_page_number }}">ถัดไป</a></li>{% endif %}
    </ul>
  </nav>
{% endif %}
