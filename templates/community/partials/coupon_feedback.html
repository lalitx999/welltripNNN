<div class="mt-2 text-xs">
  {% if is_valid %}
    <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-2xl text-emerald-800 space-y-1">
      <div class="flex items-center justify-between font-semibold">
        <span>{{ message }} ({{ coupon.code }})</span>
        <span class="font-mono text-emerald-700">-฿{{ discount|floatformat:2 }}</span>
      </div>
      <div class="text-[11px] text-emerald-600 flex justify-between border-t border-emerald-100 pt-1 mt-1">
        <span>ยอดชำระสุทธิหลังหักส่วนลด:</span>
        <span class="font-bold text-sm text-forest font-mono">฿{{ final_amount|floatformat:2 }}</span>
      </div>
    </div>
  {% else %}
    <div class="p-3 bg-red-50 border border-red-200 rounded-2xl text-red-700 flex items-center space-x-2">
      <svg class="w-4 h-4 text-red-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>{{ message }}</span>
    </div>
  {% endif %}
</div>
