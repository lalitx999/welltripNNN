{% extends "layouts/public.html" %}

{% block title %}ตะกร้าการจอง - WellTrip{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-12 space-y-6">
  <h1 class="text-2xl font-bold text-forest">ตะกร้าบริการและการสั่งซื้อ</h1>
  <div class="card-luxury p-8 text-center space-y-4">
    <div class="w-16 h-16 rounded-full bg-cream text-forest mx-auto flex items-center justify-center">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
      </svg>
    </div>
    <h3 class="text-base font-bold text-forest">ยังไม่มีรายการในตะกร้า</h3>
    <p class="text-xs text-earth/60">คุณสามารถเลือกจองที่พัก บริการนวด หรือสินค้า OTOP ชุมชนได้จากเมนูด้านบน</p>
    <a href="{% url 'accommodations:list' %}" class="btn-primary text-xs px-6 py-2.5">
      เลือกชมบริการชุมชน
    </a>
  </div>
</div>
{% endblock %}
