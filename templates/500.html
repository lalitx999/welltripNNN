<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - ข้อผิดพลาดของระบบ - WellTrip</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', sans-serif;
    }
  </style>
</head>
<body class="bg-[#faf9f6] text-[#2d2a26] min-h-screen flex items-center justify-center p-4 antialiased">
  <div class="bg-white rounded-3xl border border-stone-200/90 max-w-md w-full p-8 sm:p-10 text-center space-y-6 shadow-xl relative overflow-hidden">
    <!-- Subtle glow -->
    <div class="absolute -right-12 -top-12 w-40 h-40 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

    <div class="w-20 h-20 rounded-3xl bg-amber-50 text-amber-600 mx-auto flex items-center justify-center ring-1 ring-amber-200/60 shadow-inner">
      <i data-lucide="wrench" class="w-10 h-10 text-amber-600"></i>
    </div>

    <div class="space-y-2">
      <span class="text-xs font-bold text-amber-600 tracking-widest uppercase">500 Server Error</span>
      <h1 class="text-xl sm:text-2xl font-bold text-[#14231d]">เกิดข้อผิดพลาดภายในระบบ</h1>
      <p class="text-xs text-stone-500 leading-relaxed max-w-xs mx-auto">
        ระบบความปลอดภัยได้บันทึกข้อผิดพลาดนี้ไว้เรียบร้อยแล้ว ทีมงานวิศวกรกำลังเร่งตรวจสอบและแก้ไข
      </p>
    </div>

    <div class="pt-2">
      <a href="/" class="inline-flex items-center justify-center space-x-2 px-8 py-3 rounded-full bg-[#14231d] text-white hover:bg-[#1a2e26] text-xs font-bold transition-all shadow-md">
        <i data-lucide="home" class="w-4 h-4 text-[#c49a45]"></i>
        <span>กลับสู่หน้าแรก</span>
      </a>
    </div>
  </div>

  <script>
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  </script>
</body>
</html>
