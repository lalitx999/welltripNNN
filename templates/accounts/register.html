{% extends "layouts/public.html" %}

{% block title %}สมัครสมาชิก - WellTrip{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="card-luxury max-w-md w-full p-8 sm:p-10 space-y-6">
    <div class="text-center space-y-2">
      <h2 class="text-2xl font-bold text-forest">สร้างบัญชีผู้ใช้งานใหม่</h2>
      <p class="text-xs text-earth/60">ร่วมเป็นส่วนหนึ่งของการท่องเที่ยววิถีสุขภาวะและชุมชน</p>
    </div>

    <form method="POST" action="{% url 'accounts:register' %}" class="space-y-4">
      {% csrf_token %}

      <div>
        <label for="reg-email" class="block text-xs font-semibold text-earth mb-1">อีเมล (Email)</label>
        <input type="email" id="reg-email" name="email" required autocomplete="email"
               class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-forest focus:border-transparent"
               placeholder="name@example.com">
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label for="first_name" class="block text-xs font-semibold text-earth mb-1">ชื่อ</label>
          <input type="text" id="first_name" name="first_name" required
                 class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-forest">
        </div>
        <div>
          <label for="last_name" class="block text-xs font-semibold text-earth mb-1">นามสกุล</label>
          <input type="text" id="last_name" name="last_name" required
                 class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-forest">
        </div>
      </div>

      <div>
        <label for="role" class="block text-xs font-semibold text-earth mb-1">ประเภทผู้ใช้งาน</label>
        <select id="role" name="role" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-forest">
          <option value="TOURIST">นักท่องเที่ยว (Tourist)</option>
          <option value="HOMESTAY_OWNER">เจ้าของที่พัก / โฮมสเตย์ (Homestay Owner)</option>
          <option value="RESTAURANT_OWNER">เจ้าของร้านอาหารสุขภาพ (Restaurant Owner)</option>
          <option value="WELLNESS_OWNER">เจ้าของบริการนวด / สปา (Wellness Owner)</option>
          <option value="OTOP_OWNER">เจ้าของสินค้าชุมชน OTOP (OTOP Owner)</option>
        </select>
      </div>

      <div>
        <label for="reg-password" class="block text-xs font-semibold text-earth mb-1">รหัสผ่าน (อย่างน้อย 10 ตัวอักษร)</label>
        <input type="password" id="reg-password" name="password" required minlength="10"
               class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm focus:outline-none focus:ring-2 focus:ring-forest"
               placeholder="••••••••••">
      </div>

      <div class="pt-2">
        <button type="submit" class="btn-primary w-full text-sm py-3">
          สมัครสมาชิก
        </button>
      </div>
    </form>

    <div class="pt-4 border-t border-gray-100 text-center">
      <p class="text-xs text-earth/70">
        มีบัญชีผู้ใช้งานอยู่แล้ว? 
        <a href="{% url 'accounts:login' %}" class="font-semibold text-forest hover:underline">เข้าสู่ระบบ</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
